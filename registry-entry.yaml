# Entry to append to grafana/k6-extension-registry/registry.yaml when submitting.
# Fork the registry repo, append the block below, and run
# `xk6 lint --preset community` here and `./check-new-versions.sh --lint` there
# before opening a PR.
#
# The GitHub repo must have the `xk6` topic added (Settings, About, Topics)
# before the registry will accept the entry.

- module: github.com/msradam/xk6-llm
  description: Load testing for LLM inference servers and AI gateways. Streaming TTFT, ITL, TPOT, goodput, cost and energy metrics over the OpenAI, Anthropic, Responses and AI SDK wires, with optional export to Grafana Agent Observability.
  imports:
    - k6/x/llm
  versions:
    - "v0.1.0"
    - "v0.2.0"
    - "v0.3.0"
